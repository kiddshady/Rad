<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
  <title>Rad · vitrina</title>
  <link rel="stylesheet" href="@core/core.css">
  <link rel="stylesheet" href="@skin/index.css">
  <link rel="stylesheet" href="showcase.css">
  <!-- Solo para mostrar las dos mono lado a lado; una app normal la elige con rad.start({ fonts }). -->
  <link rel="stylesheet" href="/@fonts/roboto-mono.css">
  <script type="module" src="@core/boot.js"></script>
  <script type="module" src="showcase.js"></script>
</head>
<body>
  <div class="rad-root"></div>

  <!-- Cada vista es un template: la vitrina lo clona la primera vez que se visita. -->

  <template id="view-planos">
    <div class="sc-col">
      <header class="sc-head">
        <h1>Planos</h1>
        <p>Los planos se separan por elevación, no por bordes. Esta hoja ya es surface-1.</p>
      </header>
      <section class="sc-sec">
        <h2>Superficies</h2>
        <div class="sc-surfaces">
          <div class="sc-surface sc-s0"><span class="rad-mono">surface-0</span><small>fondo de la ventana</small></div>
          <div class="sc-surface sc-s1"><span class="rad-mono">surface-1</span><small>paneles fijos</small></div>
          <div class="sc-surface sc-s2"><span class="rad-mono">surface-2</span><small>tarjetas y controles</small></div>
          <div class="sc-surface sc-s3"><span class="rad-mono">surface-3</span><small>lo que flota</small></div>
        </div>
      </section>
      <section class="sc-sec">
        <h2>Elevación</h2>
        <div class="sc-elev">
          <div class="sc-lift sc-sh1"><span class="rad-mono">shadow-1</span><small>una tarjeta</small></div>
          <div class="sc-lift sc-sh2"><span class="rad-mono">shadow-2</span><small>menú, toast</small></div>
          <div class="sc-lift sc-sh3"><span class="rad-mono">shadow-3</span><small>un modal</small></div>
        </div>
      </section>
    </div>
  </template>

  <template id="view-texto">
    <div class="sc-col">
      <header class="sc-head">
        <h1>Texto</h1>
        <p>Una escalera de énfasis y dos familias: sans para la interfaz, mono solo para datos.</p>
      </header>
      <section class="sc-sec">
        <h2>Énfasis</h2>
        <div class="sc-card sc-stack">
          <p class="sc-t1">Texto primario: lo que hay que leer.</p>
          <p class="sc-t2">Texto secundario: lo que acompaña.</p>
          <p class="sc-t3">Texto apagado: pistas, metadatos, lo deshabilitado.</p>
        </div>
      </section>
      <section class="sc-sec">
        <h2>Tamaños</h2>
        <div class="sc-card sc-stack">
          <p class="sc-fs-xl">Un título de vista</p>
          <p class="sc-fs-l">Un subtítulo o un texto destacado</p>
          <p class="sc-fs-m">El tamaño base de la interfaz, el que más se lee.</p>
          <p class="sc-fs-s sc-t2">Un texto chico, para etiquetas y ayudas.</p>
          <p class="sc-fs-xs sc-t3">El más chico de todos.</p>
          <pre class="sc-code">S:\tools\Rad\packages\core\renderer\core.css   0.2.0   200 ms</pre>
        </div>
      </section>
      <section class="sc-sec">
        <h2>La fuente de los datos</h2>
        <p class="sc-t2">Las dos opciones para el mono, lado a lado. La piel trae una; cada app puede elegir otra con <code>rad.start({ fonts: { mono: 'roboto-mono' } })</code>.</p>
        <div class="sc-monos">
          <figure class="sc-card sc-mono-card">
            <figcaption class="sc-t3 sc-fs-s">Cascadia Mono · viene con Windows</figcaption>
            <pre class="sc-mono-sample sc-mono-cascadia">const ajustes = await openDoc('ajustes');
ajustes.patch({ densidad: 'compacta' });
// 0O 1lI {} [] () =&gt; != === 3.14159
S:\tools\Rad\packages\core   0.4.0</pre>
          </figure>
          <figure class="sc-card sc-mono-card">
            <figcaption class="sc-t3 sc-fs-s">Roboto Mono · viaja con Rad</figcaption>
            <pre class="sc-mono-sample sc-mono-roboto">const ajustes = await openDoc('ajustes');
ajustes.patch({ densidad: 'compacta' });
// 0O 1lI {} [] () =&gt; != === 3.14159
S:\tools\Rad\packages\core   0.4.0</pre>
          </figure>
        </div>
      </section>
      <section class="sc-sec">
        <h2>Un texto largo, para ver el scroll</h2>
        <div class="sc-card sc-stack sc-prose">
          <p>El esfumado de arriba y de abajo aparece solo cuando de ese lado hay contenido recortado. Scrolleá esta vista hasta el fondo y fijate que el borde de abajo deja de esfumarse; volvé arriba y pasa lo mismo con el de arriba.</p>
          <p>Cada vista conserva su scroll: si te vas a otra y volvés, la encontrás donde la dejaste. Las vistas ocultas siguen vivas, solo que no se ven ni reciben el foco.</p>
          <p>El cambio entre vistas es un fundido: la nueva está entera y quieta debajo, y la vieja se esfuma encima. La pantalla nunca queda destapada en el medio.</p>
          <p>Probá cambiar de vista muy rápido, o volver a la anterior antes de que termine de irse: la que vuelve sube desde donde iba, sin saltar.</p>
          <p>El indicador del rail viaja al item activo. La primera vez se coloca en el acto, para no nacer en la punta y viajar en cada arranque.</p>
          <p>La statusbar cambia de texto con un relevo chico: lo viejo se esfuma en su lugar y lo nuevo asoma cuando lo viejo va por un tercio.</p>
        </div>
      </section>
    </div>
  </template>

  <template id="view-acento">
    <div class="sc-col">
      <header class="sc-head">
        <h1>Acento y estado</h1>
        <p>El acento marca la acción primaria, lo activo y el foco. Probá navegar con Tab y con las flechas en el rail.</p>
      </header>
      <section class="sc-sec">
        <div class="sc-card sc-row">
          <button class="rad-button" data-variant="primary" type="button">Acción primaria</button>
          <button class="rad-button" type="button">Secundaria</button>
          <span class="sc-chip">Activo</span>
          <span class="sc-state"><i class="sc-dot-success"></i>Listo</span>
          <span class="sc-state"><i class="sc-dot-warning"></i>Atención</span>
          <span class="sc-state"><i class="sc-dot-danger"></i>Error</span>
        </div>
      </section>
    </div>
  </template>

  <template id="view-forma">
    <div class="sc-col">
      <header class="sc-head">
        <h1>Forma</h1>
        <p>Esquinas de redondeo sutil: suavizan sin llamar la atención.</p>
      </header>
      <section class="sc-sec">
        <div class="sc-card sc-row">
          <div class="sc-shape sc-r-s"><span class="rad-mono">radius-s</span></div>
          <div class="sc-shape sc-r-m"><span class="rad-mono">radius-m</span></div>
          <div class="sc-shape sc-r-l"><span class="rad-mono">radius-l</span></div>
          <div class="sc-shape sc-r-pill"><span class="rad-mono">radius-pill</span></div>
        </div>
      </section>
    </div>
  </template>

  <template id="view-capas">
    <div class="sc-col">
      <header class="sc-head">
        <h1>Capas</h1>
        <p>Lo que flota: menús, modales, toasts y tooltips. Todo entra y sale animado, y se maneja con el teclado.</p>
      </header>
      <section class="sc-sec">
        <h2>Menú</h2>
        <div class="sc-card sc-row">
          <button class="rad-button" type="button" data-demo="menu">Acciones
            <span class="rad-icon"><svg viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg></span>
          </button>
          <span class="sc-t3">Con el teclado: Enter o la flecha abajo lo abren, las flechas recorren, Escape lo cierra.</span>
        </div>
      </section>
      <section class="sc-sec">
        <h2>Modal</h2>
        <div class="sc-card sc-row">
          <button class="rad-button" type="button" data-demo="modal">Abrir un modal</button>
          <button class="rad-button" type="button" data-demo="confirm">Confirmar algo destructivo</button>
        </div>
      </section>
      <section class="sc-sec">
        <h2>Toasts</h2>
        <div class="sc-card sc-row">
          <button class="rad-button" type="button" data-demo="toast" data-kind="info">Info</button>
          <button class="rad-button" type="button" data-demo="toast" data-kind="success">Éxito</button>
          <button class="rad-button" type="button" data-demo="toast" data-kind="warning">Advertencia</button>
          <button class="rad-button" type="button" data-demo="toast" data-kind="danger">Error</button>
          <button class="rad-button" type="button" data-demo="undo">Con acción</button>
          <button class="rad-button" type="button" data-variant="quiet" data-demo="burst">Una tanda de cinco</button>
        </div>
      </section>
      <section class="sc-sec">
        <h2>Tooltips</h2>
        <div class="sc-card sc-row">
          <button class="rad-iconbutton" type="button" aria-label="Guardar" data-rad-tip="Guardar" data-rad-tip-key="Ctrl+S">
            <span class="rad-icon"><svg viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5h8l2.5 2.5v8.5h-11z"/><path d="M5.5 2.5v3h5v-3M5 13.5v-4h6v4"/></svg></span>
          </button>
          <button class="rad-iconbutton" type="button" aria-label="Buscar" data-rad-tip="Buscar" data-rad-tip-key="Ctrl+F">
            <span class="rad-icon"><svg viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></span>
          </button>
          <button class="rad-iconbutton" type="button" aria-label="Compartir" data-rad-tip="Compartir">
            <span class="rad-icon"><svg viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2.5M5 5.5l3-3 3 3"/><path d="M3 9v4.5h10V9"/></svg></span>
          </button>
          <button class="rad-iconbutton" type="button" aria-label="Ajustes" data-rad-tip="Ajustes" data-rad-tip-side="bottom">
            <span class="rad-icon"><svg viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></svg></span>
          </button>
          <span class="sc-t3">Pasá el mouse: el primero espera un poco, los siguientes salen enseguida.</span>
        </div>
      </section>
    </div>
  </template>

  <template id="view-controles">
    <div class="sc-col">
      <header class="sc-head">
        <h1>Controles</h1>
        <p>Nada del control nativo de Chromium se ve: son inputs de verdad, escondidos, con el dibujo propio encima.</p>
      </header>
      <section class="sc-sec">
        <h2>Un formulario</h2>
        <form class="sc-card sc-form" data-demo="form" novalidate>
          <label class="rad-field">
            <span class="rad-field-label">Nombre</span>
            <input class="rad-input" type="text" name="nombre" placeholder="Cómo te llamás" autocomplete="off" data-demo="nombre">
            <span class="rad-field-hint">Obligatorio.</span>
          </label>
          <div class="rad-field">
            <span class="rad-field-label" id="sc-turno-label">Turno</span>
            <div data-demo="turno"></div>
            <span class="rad-field-hint">Un select propio: el menú calza con el botón.</span>
          </div>
          <label class="rad-field">
            <span class="rad-field-label">Dosis (mg)</span>
            <input class="rad-input" type="number" name="dosis" min="0" step="5" value="20" data-demo="dosis">
          </label>
          <label class="rad-field">
            <span class="rad-field-label">Correo</span>
            <input class="rad-input" type="email" name="correo" placeholder="nombre@ejemplo.com" autocomplete="off" data-demo="correo">
          </label>
          <label class="rad-field sc-wide">
            <span class="rad-field-label">Notas</span>
            <textarea class="rad-input" name="notas" rows="3" placeholder="Algo que quieras dejar anotado"></textarea>
          </label>
          <div class="sc-choices sc-wide">
            <span class="rad-field-label">Avisos</span>
            <div class="sc-choices-row">
              <label class="rad-switch"><input type="checkbox" role="switch" name="sonido" data-demo="sonido"><span class="rad-switch-track"></span>Sonido</label>
              <label class="rad-switch"><input type="checkbox" role="switch" name="badge" checked><span class="rad-switch-track"></span>Contador en el ícono</label>
              <label class="rad-switch"><input type="checkbox" role="switch" disabled><span class="rad-switch-track"></span>Deshabilitado</label>
            </div>
          </div>
          <div class="sc-choices">
            <span class="rad-field-label">Mostrar</span>
            <label class="rad-check"><input type="checkbox" name="vencidos" data-demo="vencidos"><span class="rad-check-box"></span>Los vencidos</label>
            <label class="rad-check"><input type="checkbox" name="archivados" checked><span class="rad-check-box"></span>Los archivados</label>
            <label class="rad-check"><input type="checkbox" disabled><span class="rad-check-box"></span>Deshabilitado</label>
          </div>
          <div class="sc-choices" role="radiogroup" aria-label="Orden">
            <span class="rad-field-label">Ordenar por</span>
            <label class="rad-radio"><input type="radio" name="orden" value="fecha" checked data-demo="orden-fecha"><span class="rad-radio-dot"></span>Fecha</label>
            <label class="rad-radio"><input type="radio" name="orden" value="nombre" data-demo="orden-nombre"><span class="rad-radio-dot"></span>Nombre</label>
            <label class="rad-radio"><input type="radio" name="orden" value="dosis"><span class="rad-radio-dot"></span>Dosis</label>
          </div>
          <div class="sc-form-actions sc-wide">
            <button class="rad-iconbutton" type="button" aria-label="Fijar" aria-pressed="false" data-rad-tip="Fijar" data-demo="pin">
              <span class="rad-icon"><svg viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h4M7 2.5v4L4.5 9h7L9 6.5v-4M8 9v4.5"/></svg></span>
            </button>
            <button class="rad-button" type="reset" data-variant="quiet">Limpiar</button>
            <button class="rad-button" type="submit" data-variant="primary">Guardar</button>
          </div>
        </form>
      </section>
    </div>
  </template>

  <template id="view-datos">
    <div class="sc-col">
      <header class="sc-head">
        <h1>Datos</h1>
        <p>Lo que se guarda en disco y el puente con el proceso principal.</p>
      </header>
      <section class="sc-sec">
        <h2>Un documento guardado</h2>
        <div class="sc-card sc-stack">
          <label class="rad-field">
            <span class="rad-field-label">Escribí algo, cerrá la vitrina y volvé a abrirla.</span>
            <textarea id="sc-nota" class="rad-input" rows="4" spellcheck="false" placeholder="Una nota que sobrevive al cierre"></textarea>
            <span class="rad-field-hint" data-demo="visitas"></span>
          </label>
        </div>
      </section>
      <section class="sc-sec">
        <h2>La ventana</h2>
        <div class="sc-card sc-stack">
          <p class="sc-t2">Moverla, cambiarle el tamaño o maximizarla también se guarda. Si el monitor donde estaba ya no está, vuelve al centro del principal.</p>
        </div>
      </section>
      <section class="sc-sec">
        <h2>El puente</h2>
        <div class="sc-card sc-stack">
          <p class="sc-t2">Esto lo contesta el proceso principal, con <code>rad.invoke('sistema:info')</code>:</p>
          <dl class="sc-facts" data-demo="info"></dl>
          <p class="sc-t2">Un link a la web se abre en tu navegador, nunca adentro de la app: <a class="sc-link" href="https://github.com/kiddshady/Rad" target="_blank">el repo de Rad en GitHub</a>.</p>
        </div>
      </section>
    </div>
  </template>

  <template id="view-movimiento">
    <div class="sc-col">
      <header class="sc-head">
        <h1>Movimiento</h1>
        <p>Lo que entra usa ease-out; lo que sale, ease-in; lo que se releva, ease-in-out. Nada aparece ni se va de golpe.</p>
      </header>
      <section class="sc-sec">
        <h2>Entrada y salida</h2>
        <div class="sc-card sc-motion">
          <button class="rad-button" type="button" data-demo="toggle">Probar la entrada y la salida</button>
          <div class="sc-demo-slot">
            <div class="sc-demo"><span class="rad-mono">dur-base · ease-out / ease-in</span></div>
          </div>
        </div>
      </section>
      <section class="sc-sec">
        <h2>Relevo chico</h2>
        <div class="sc-card sc-row">
          <button class="rad-button" type="button" data-demo="status">Cambiar el mensaje de la statusbar</button>
          <span class="sc-t3">Mirá la esquina de abajo a la derecha.</span>
        </div>
      </section>
      <section class="sc-sec">
        <h2>Cargando</h2>
        <p class="sc-t2">Una luz recorre el reborde de lo que está trabajando, a la misma velocidad en todo el recorrido. Lo que carga a la vez gira en fase.</p>
        <div class="sc-ask" data-demo="ask">
          <input class="rad-input" type="text" placeholder="Preguntá algo y apretá Enter" aria-label="Pregunta" autocomplete="off" data-demo="ask-input">
          <button class="rad-iconbutton" type="button" aria-label="Enviar" data-rad-tip="Enviar" data-demo="ask-send">
            <span class="rad-icon"><svg viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h9.5M8.5 4l4 4-4 4"/></svg></span>
          </button>
        </div>
        <div class="sc-card sc-row" data-demo="busy-card">
          <button class="rad-button" type="button" data-demo="busy-card-go">Cargar esta tarjeta</button>
          <button class="rad-button" type="button" data-variant="primary" data-demo="busy-self">Guardar</button>
          <label class="rad-switch"><input type="checkbox" role="switch" data-demo="busy-hold"><span class="rad-switch-track"></span>Dejar todo cargando</label>
        </div>
      </section>
    </div>
  </template>

  <template id="view-pieles">
    <div class="sc-col">
      <header class="sc-head">
        <h1>Pieles</h1>
        <p>El mismo núcleo, vestido distinto. Una piel fija el color con que nace la ventana, así que no se cambia en caliente: la vitrina se cierra y vuelve a abrir con la que elijas.</p>
      </header>
      <section class="sc-sec">
        <div class="sc-skins" data-demo="pieles"></div>
      </section>
    </div>
  </template>
</body>
</html>
